<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="flameBackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="blueArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="purpleArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Outer Flame Body -->
  <path d="M 250,20 C 320,100 370,160 370,240 C 370,330 310,380 250,380 C 190,380 130,330 130,240 C 130,160 180,100 250,20 Z" fill="url(#flameGrad)" />
  
  <!-- Secondary Flame Tongue -->
  <path d="M 290,110 C 330,150 360,190 350,230 C 340,190 310,160 290,110 Z" fill="#fdba74" opacity="0.8" />
  <path d="M 220,130 C 190,170 170,210 180,250 C 190,210 210,180 220,130 Z" fill="#fdba74" opacity="0.6" />

  <!-- Center White Circle Shield -->
  <circle cx="250" cy="250" r="85" fill="#ffffff" />

  <!-- Inner Blue & Purple Interlocking Rings -->
  <!-- Left Blue Arc -->
  <path d="M 250,180 A 70 70 0 0 0 180,250 A 70 70 0 0 0 250,320 C 230,300 210,280 210,250 C 210,220 230,200 250,180 Z" fill="url(#blueArc)" />
  
  <!-- Right Purple Arc -->
  <path d="M 250,180 A 70 70 0 0 1 320,250 A 70 70 0 0 1 250,320 C 270,300 290,280 290,250 C 290,220 270,200 250,180 Z" fill="url(#purpleArc)" />

  <!-- Center White Aperture Core -->
  <circle cx="250" cy="250" r="30" fill="#ffffff" />

  <!-- Brand Typography below -->
  <text x="250" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Sync</text>
  
  <line x1="120" y1="468" x2="190" y2="468" stroke="#ffffff" stroke-width="2" opacity="0.7" />
  <text x="250" y="474" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="6" opacity="0.9">CONNECT</text>
  <line x1="310" y1="468" x2="380" y2="468" stroke="#ffffff" stroke-width="2" opacity="0.7" />
</svg>
